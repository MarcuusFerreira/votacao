services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U myuser -d mydatabase']
      interval: 2s
      timeout: 3s
      retries: 15

  # Only started with `docker compose --profile app up`, so `./gradlew bootRun`
  # (Spring Boot Docker Compose support) keeps starting just the database.
  app:
    build: .
    profiles: ['app']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/mydatabase'
      - 'SPRING_DATASOURCE_USERNAME=myuser'
      - 'SPRING_DATASOURCE_PASSWORD=secret'
    ports:
      - '8080:8080'

  # Load test: `docker compose run --rm k6` (app must be up). Tune with -e VOTES=... -e VUS=...
  k6:
    image: 'grafana/k6:latest'
    profiles: ['k6']
    environment:
      - 'BASE_URL=http://app:8080'
    volumes:
      - './k6:/scripts:ro'
    command: ['run', '/scripts/vote-load.js']
