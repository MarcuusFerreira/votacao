spring:
  application:
    name: votos
  jpa:
    # Open Session in View would keep the JPA connection for the whole request while the vote
    # insert (JDBC) takes a second one; under concurrent votes that starves the pool.
    open-in-view: false
  http:
    clients:
      # Timeouts applied to the auto-configured RestClient.Builder (used by MemberEligibilityClient),
      # so a slow/hung external service cannot hold request threads indefinitely.
      connect-timeout: 3s
      read-timeout: 5s

voting:
  session:
    default-duration: 60s
  member:
    base-url: https://user-info.herokuapp.com
    # Bonus 1 disabled by default: the challenge's demo service was discontinued by Heroku.
    verification-enabled: false
