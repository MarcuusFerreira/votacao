spring:
  application:
    name: votos
  datasource:
    hikari:
      # Sized by load test (k6, 100k votes, 200 VUs, 8 CPUs). Each vote is a single insert, so
      # throughput is bound by commit latency per connection: 20 -> 40 cut the run from ~24.4s to
      # ~17.3s; 60 was within noise (~16.4s). See README for the full measurements.
      maximum-pool-size: 40
  threads:
    virtual:
      # Request handling on virtual threads (Java 25): blocking on the connection pool or on the
      # CPF verification service no longer ties up a limited pool of platform threads.
      enabled: true
  jackson:
    deserialization:
      # Integer fields (e.g. duracaoSegundos) reject 1.5 instead of silently truncating it to 1.
      accept-float-as-int: false
  jpa:
    # Open Session in View would keep the JPA connection for the whole request while the vote
    # insert (JDBC) takes a second one; under concurrent votes that starves the pool.
    open-in-view: false
  http:
    clients:
      # Timeouts applied to the auto-configured RestClient.Builder (used by MemberEligibilityClient),
      # so a slow/hung external service cannot hold request threads indefinitely.
      connect-timeout: 3s
      read-timeout: 5s

voting:
  # Base of the absolute callback URLs embedded in screens (emulator: http://10.0.2.2:8080,
  # physical device: http://<host-ip>:8080, deployed: https://<domain>).
  public-base-url: http://localhost:8080
  session:
    default-duration: 60s
  member:
    base-url: https://user-info.herokuapp.com
    # Bonus 1 disabled by default: the challenge's demo service was discontinued by Heroku.
    verification-enabled: false
